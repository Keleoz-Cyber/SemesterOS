# Managed by SemesterOS subdomain migration.
server {
    listen 80;
    listen [::]:80;
    server_name semesteros.keleoz.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/semesteros-acme;
        try_files $uri =404;
    }
    location / { return 308 https://semesteros.keleoz.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name semesteros.keleoz.com;
    ssl_certificate /etc/letsencrypt/live/semesteros.keleoz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semesteros.keleoz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /phone.apk { return 404; }
    location / {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:8871;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        add_header Cache-Control "private, no-store" always;
    }
}
