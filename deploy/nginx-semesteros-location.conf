# Include only inside the existing HTTPS server block.
location = /semesteros {
    return 308 /semesteros/;
}
location = /semesteros/docs { return 404; }
location = /semesteros/redoc { return 404; }
location = /semesteros/openapi.json { return 404; }
location = /semesteros/phone.apk {
    alias /var/www/semesteros/phone.apk;
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition 'attachment; filename="SemesterOS-phone-test.apk"';
}
location ^~ /semesteros/ {
    client_max_body_size 21m;
    proxy_pass http://127.0.0.1:8871/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx has already resolved the client IP; do not trust a client-supplied chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    add_header Cache-Control "private, no-store" always;
}
