# Retired after https://semesteros.keleoz.com passed verification.
# Keep explicit tombstones so requests never fall through to the blog.
location = /semesteros {
    add_header Cache-Control "no-store" always;
    return 410;
}
location ^~ /semesteros/ {
    add_header Cache-Control "no-store" always;
    return 410;
}
