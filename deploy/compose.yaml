name: semesteros
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: semesteros
      POSTGRES_USER: semesteros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - semesteros_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semesteros -d semesteros"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://semesteros:${POSTGRES_PASSWORD}@db:5432/semesteros
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://semesteros:${POSTGRES_PASSWORD}@db:5432/semesteros
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      MEDIA_ROOT: /app/.local-data/media
      SENSEVOICE_MODEL_DIR: /app/.local-data/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
    volumes:
      - semesteros_media:/app/.local-data/media
      - ../.local-data/models:/app/.local-data/models:ro
    ports:
      - "127.0.0.1:8871:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  semesteros_db:
  semesteros_media:
