name: semesteros-cloud
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://semesteros:${POSTGRES_PASSWORD:?required}@db:5432/semesteros
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?required}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  MEDIA_ROOT: /app/.local-data/media
  SENSEVOICE_MODEL_DIR: /models/sensevoice
  RAPIDOCR_MODEL_DIR: /models/rapidocr
  MEDIA_WORKER_MODE: external
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
x-app: &app
  image: semesteros-api:${APP_TAG:-phone-test}
  build:
    context: ..
    dockerfile: services/api/Dockerfile
    args:
      DEBIAN_MIRROR_HOST: mirrors.cloud.tencent.com
      PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
  environment: *app-env
  volumes:
    - media:/app/.local-data/media
    - ${MODEL_ROOT:-/opt/semesteros/models}:/models:ro
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: semesteros
      POSTGRES_USER: semesteros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - db:/var/lib/postgresql/data
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U semesteros -d semesteros"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    command: [uvicorn, "app.main:create_app", --factory, --host, "0.0.0.0", --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.5
    ports: ["127.0.0.1:8871:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 5
  worker:
    <<: *app
    command: [python, -m, app.media_worker]
    restart: unless-stopped
    mem_limit: 1400m
    cpus: 1.0
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  db:
  media:
